<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Reserva | Estacionamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <header>
        <h1>Residencial Bossa Nova</h1>
        <nav>
            <ul>
                <li><a href="index.html">Vagas cadastradas</a></li>
                <li><a href="cadastro.html">Nova reserva</a></li>
                <li><a href="disponiveis.html">Vagas disponíveis</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Cadastro de reserva de vaga</h2>
        
        <form id="form-reserva">
            <fieldset>
                <legend>Dados do veículo</legend>

                <div class="campo">
                    <label for="placa">Placa</label>
                    <input type="text" id="placa" name="placa" placeholder="Ex.: ABC1D23" maxlength="7" required>
                </div>

                <div class="campo">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" name="modelo" placeholder="Ex.: Onix" required>
                </div>

                <div class="campo">
                    <label for="cor">Cor</label>
                    <input type="text" id="cor" name="cor" placeholder="Ex.: Prata" required>
                </div>
            </fieldset>
        </form>
    </main>
</body>
</html>
